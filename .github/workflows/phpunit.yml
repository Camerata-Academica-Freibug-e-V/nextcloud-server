name: PHPUnit

on:
  pull_request:
    branches: [cjh-stable35]
  push:
    branches: [cjh-stable35]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}
      resources: ${{ steps.changes.outputs.resources }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: changes
        continue-on-error: true
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.ref }}
          filters: |
            src:
              - '.github/workflows/phpunit.yml'
              - '.github/workflows/phpunit-mariadb.yml'
              - '3rdparty/**'
              - '**/appinfo/info.xml'
              - '**/composer.json'
              - '**/composer.lock'
              - 'tests/*.xml'
              - 'tests/**/data/**'
              - 'apps/*/tests/**/data/**'
              - 'apps/*/tests/**/fixtures/**'
              - 'apps/*/tests/**/test_fixtures/**'
              - '**/*.php'
            resources:
              - 'resources/**'

  mariadb:
    needs: changes
    if: needs.changes.outputs.src != 'false' || needs.changes.outputs.resources != 'false'
    uses: ./.github/workflows/phpunit-mariadb.yml

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, mariadb]

    if: always()

    name: phpunit-summary

    steps:
      # Skipped jobs are fine, they mean no relevant changes were detected
      - name: Summary status
        run: if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi
