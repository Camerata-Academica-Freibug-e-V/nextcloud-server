name: OpenAPI

on:
  pull_request:
    branches: [cjh-stable35]
  push:
    branches: [cjh-stable35]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.changes.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: changes
        continue-on-error: true
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.ref }}
          filters: |
            src:
              - '.github/workflows/openapi.yml'
              - '3rdparty/**'
              - '**/*.php'
              - '**/composer.json'
              - '**/composer.lock'
              - '**/openapi*.json'
              - 'build/openapi-checker.sh'

  openapi:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false' && github.repository_owner != 'nextcloud-gmbh'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        with:
          php-version: '8.5'
          extensions: ctype, curl, dom, fileinfo, gd, json, libxml, mbstring, openssl, pcntl, pdo, posix, session, simplexml, xml, xmlreader, xmlwriter, zip, zlib
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up dependencies
        run: composer i

      - name: OpenAPI checker
        run: build/openapi-checker.sh
