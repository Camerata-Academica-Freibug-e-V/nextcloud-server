name: Playwright Tests

on:
  pull_request:
    branches: [cjh-stable35]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches: [cjh-stable35]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Branch of the vendored apps (e.g. viewer) cloned into the test server
  BRANCH: stable35

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.changes.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: changes
        continue-on-error: true
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.ref }}
          filters: |
            src:
              - '.github/workflows/**'
              - '3rdparty/**'
              - 'apps/**'
              - 'core/**'
              - 'dist/**'
              - 'lib/**'
              - 'resources/**'
              - 'tests/playwright/**'
              - 'build/**'
              - '**/*.php'
              - 'package*.json'
              - 'playwright.config.ts'
              - 'composer.*'

  playwright-setup:
    timeout-minutes: 15
    name: Playwright setup
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.src != 'false'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: true # for 3rdparty
    - name: Read package.json
      uses: nextcloud-libraries/parse-package-engines-action@39fcc545a815c353dd0a3fd8fd2ef6e59fd02b92 # v0.2.0
      id: versions
    - name: Set up node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.versions.outputs.node-version }}
    - name: Set up npm
      run: npm i -g 'npm@${{ steps.versions.outputs.package-manager-version }}'
    - name: Install dependencies and build
      run: |
        npm ci
        npm run build --if-present
    - name: Save context
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-context-${{ github.run_id }}
        path: ./

  playwright-tests:
    needs: [gate, playwright-setup]
    timeout-minutes: 60
    name: Playwright tests ${{ matrix.shardIndex }} / ${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    outputs:
      node-version: ${{ steps.versions.outputs.node-version }}
      package-manager-version: ${{ steps.versions.outputs.package-manager-version }}

    steps:
    - name: Restore context
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-context-${{ github.run_id }}
        path: ./

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        persist-credentials: false
        submodules: true # for 3rdparty

    - name: Read package.json
      uses: nextcloud-libraries/parse-package-engines-action@39fcc545a815c353dd0a3fd8fd2ef6e59fd02b92 # v0.2.0
      id: versions

    - name: Set up node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.versions.outputs.node-version }}

    - name: Set up npm
      run: npm i -g 'npm@${{ steps.versions.outputs.package-manager-version }}'

    - name: Install dependencies and build
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        npm ci
        npm run build --if-present

    - name: Install Playwright browsers
      run: npm run playwright:install

    - name: Run Playwright tests
      run: >-
        npx playwright test
        --project=default --project=admin-settings --project=sharing
        tests/playwright/e2e/login
        tests/playwright/e2e/files/
        tests/playwright/e2e/files_sharing
        --shard='${{ matrix.shardIndex }}/${{ matrix.shardTotal }}'

    - name: Show logs
      if: failure()
      run: |
        for id in $(docker ps -aq); do
          docker container inspect "$id" --format '=== Logs for container {{.Name}} ==='
          docker logs "$id" >> nextcloud.log
        done
        echo '=== Nextcloud server logs ==='
        docker exec nextcloud-e2e-test-server_server cat data/nextcloud.log

    - name: Upload blob report to GitHub Actions Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: blob-report
        retention-days: 1

  merge-reports:
    # Merge reports after playwright-tests, even if some shards have failed
    if: ${{ !cancelled() && needs.gate.outputs.src != 'false' && needs.playwright-tests.result != 'skipped' }}
    needs: [gate, playwright-tests]

    runs-on: ubuntu-latest
    steps:
    - name: Restore context
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-context-${{ github.run_id }}
        path: ./

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        node-version: ${{ needs.playwright-tests.outputs.node-version }}

    - name: Set up npm
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm i -g 'npm@${{ needs.playwright-tests.outputs.package-manager-version }}'

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci

    - name: Download blob reports from GitHub Actions Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: all-blob-reports
        pattern: blob-report-*
        merge-multiple: true

    - name: Merge into HTML Report
      run: npx playwright merge-reports --config tests/playwright/merge.config.ts --reporter html,github ./all-blob-reports

    - name: Upload HTML report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: html-report--attempt-${{ github.run_attempt }}
        path: playwright-report
        retention-days: 7

    - name: Show the logs
      run: |
        echo 'To view the report:'
        echo '  1. Extract the folder from the zip file'
        echo '  2. run "npx playwright show-report name-of-my-extracted-playwright-report"'

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [gate, playwright-tests]

    if: always()

    name: playwright-test-summary

    steps:
      - name: Summary status
        run: if ${{ needs.gate.result != 'success' || (needs.gate.outputs.src != 'false' && needs.playwright-tests.result != 'success') }}; then exit 1; fi
