name: Code checkers

on:
  pull_request:
    branches: [cjh-stable35]
  push:
    branches: [cjh-stable35]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autocheckers-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}
      autoloader: ${{ steps.changes.outputs.autoloader }}
      psalm: ${{ steps.changes.outputs.psalm }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: changes
        continue-on-error: true
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.ref }}
          filters: |
            src:
              - '.github/workflows/autocheckers.yml'
              - '3rdparty/**'
              - '**/appinfo/info.xml'
              - '**/composer.json'
              - '**/composer.lock'
              - '**/*.php'
            autoloader:
              - 'build/autoloaderchecker.sh'
            psalm:
              - 'build/psalm-checker.sh'

  autoloader:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false' || needs.changes.outputs.autoloader != 'false'

    name: PHP checkers

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        with:
          php-version: '8.5'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check auto loaders
        run: bash ./build/autoloaderchecker.sh

  autocheckers:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false' || needs.changes.outputs.psalm != 'false'

    name: Translation and Files checkers

    steps:
      - name: Checkout server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        timeout-minutes: 5
        with:
          php-version: '8.5'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
          ini-file: development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check translations are JSON decodeable
        if: needs.changes.outputs.src != 'false'
        run: php ./build/translation-checker.php

      - name: Check translations do not contain triple dot but ellipsis
        if: needs.changes.outputs.src != 'false'
        run: php ./build/triple-dot-checker.php

      - name: Check .htaccess does not contain invalid changes
        if: needs.changes.outputs.src != 'false'
        run: php ./build/htaccess-checker.php

      - name: Check that all and only expected files are included
        if: needs.changes.outputs.src != 'false'
        run: php ./build/files-checker.php

      - name: Check that all shipped apps are linted by psalm
        run: sh ./build/psalm-checker.sh

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, autoloader, autocheckers]

    if: always()

    name: autocheckers-summary

    steps:
      - name: Summary status
        run: if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi
