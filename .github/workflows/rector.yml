name: Rector

on:
  pull_request:
    branches: [cjh-stable35]
  push:
    branches: [cjh-stable35]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rector-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: changes
        continue-on-error: true
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.ref }}
          filters: |
            src:
              - '.github/workflows/rector.yml'
              - '3rdparty/**'
              - '.php-cs-fixer.dist.php'
              - '**/composer.json'
              - '**/composer.lock'
              - '**/*.php'

  strict:
    runs-on: ubuntu-latest

    needs: changes
    if: needs.changes.outputs.src != 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up php
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: apcu,ctype,curl,dom,fileinfo,ftp,gd,imagick,intl,json,ldap,mbstring,openssl,pdo_sqlite,posix,sqlite,xml,zip
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Composer install
        run: composer i

      - name: Rector
        run: composer run rector:strict

      - name: Show changes
        if: always()
        run: git diff --exit-code -- . ':!lib/composer'

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [changes, strict]

    if: always()

    name: rector-summary

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.strict.result != 'success' }}; then exit 1; fi
